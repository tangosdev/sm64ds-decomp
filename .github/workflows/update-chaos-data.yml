# On every push to main, regenerate all the derived progress views from committed
# data and land them in ONE commit (README bar + treemap + contributions.json +
# langmode-baseline.json on main; chaos-db.json on the chaos-data branch), so the
# hosted viewer and charts self-update without spamming the #github channel with a
# commit per file. details/ chunks on the chaos-data branch are preserved (they need
# the ROM; refreshed locally).
name: update-chaos-data

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "include/**"
      - "nearmiss/**"
      - "tools/chaos_db_ci.py"
      - "tools/chaosviewer.config.json"
      - "tools/langmode_audit.py"
      - "attribution.json"
      # include/** and tools/langmode_audit.py are here for the langmode re-bank below,
      # which reads both; neither feeds chaos-db. langmode-baseline.json itself is
      # deliberately NOT watched -- this job writes it, and watching it would let the
      # refresh commit retrigger the job on any run where [skip ci] is not honoured.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaos-data
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    # This job's own refresh commit now touches config/ (the provenance ledger), which
    # is a watched path, so without this guard it would retrigger itself once per run.
    # Skipping the bot's own pushes is safe: a refresh commit never contains new matches.
    # Secondary defense now: the refresh commit below carries [skip ci], because a
    # deploy-key push is not attributed to github-actions[bot] and slips past this.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: per-function authors come from git log
          # main is gated by the "main: validation + review gate" ruleset, which requires
          # a PR for every change. GitHub Actions cannot hold a ruleset bypass on this
          # repo because tangosdev is a user account and not an org, and GitHub only
          # accepts an Integration bypass actor from the ruleset source or owner org.
          # So the refresh push at the end of this job authenticates with a write deploy
          # key, which the ruleset bypasses by actor type. A deploy key can push; it
          # cannot approve or merge a pull request, which is the hole this closes.
          ssh-key: ${{ secrets.CHAOS_PUSH_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: chaos-data
          path: _chaos_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tool dependencies
        # tools/nearmiss_db.py imports match.py/swarm.py at module level, which need
        # pyelftools + capstone; without them the dedupe step kills the whole run
        # before the refresh commit (which is what keeps contributions.json moving).
        run: pip install pyelftools capstone
      - name: Regenerate chaos-db.json + contributions.json
        run: python tools/chaos_db_ci.py --out _chaos_data/chaos-db.json --contrib-out contributions.json
      - name: Push if changed
        run: |
          cd _chaos_data
          if git diff --quiet -- chaos-db.json; then
            echo "no data change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add chaos-db.json
          git commit -m "Refresh Chaos Viewer data from $(git -C .. rev-parse --short HEAD)"
          # Two PRs merging seconds apart start this job twice, and cancel-in-progress only
          # kills the older run if it has not reached this step yet. Past that point both runs
          # push and the loser is rejected, because chaos-data moved under it. That failure is
          # not cosmetic: the run goes red having published nothing, so the matches that just
          # merged stay off the viewer until the NEXT merge happens to republish them.
          #
          # So retry onto the moved branch. If it moved because another run already republished
          # chaos-db.json, that run read a newer main than this one did and its file is the
          # better one - stand down rather than overwrite it with older data.
          for attempt in 1 2 3; do
            if git push origin chaos-data; then exit 0; fi
            git fetch -q origin chaos-data
            if ! git diff --quiet "$base" FETCH_HEAD -- chaos-db.json; then
              echo "another run already published newer data - standing down"; exit 0
            fi
            echo "chaos-data moved under the push - rebasing (attempt $attempt)"
            git rebase FETCH_HEAD || { echo "rebase onto the moved branch failed"; exit 1; }
          done
          echo "chaos-data kept moving - could not land chaos-db.json"; exit 1
      - name: Stamp provenance for functions that landed in this push
        # HOW a match was made is only knowable as it lands: a later backfill can
        # recover the method for ~13% of matches and no more. Declines to guess, so an
        # unlabelled commit leaves the function unstamped rather than inventing a model.
        run: python tools/stamp_landed.py
      - name: Collapse any duplicate near-miss rows from a union merge
        # nearmiss/db.jsonl is merge=union (.gitattributes), so two PRs banking a tip for the
        # same function land both rows instead of conflicting. Keep the lowest-divergence row
        # per (module, addr); the duplicate is transient, cleaned here on the way to the
        # refresh commit below (which already includes nearmiss/db.jsonl).
        run: python tools/nearmiss_db.py dedupe
      - name: Re-bank the langmode ratchet
        # The baseline is a generated counter file with no meaningful hand-merge, and
        # every migration PR that lowered a count used to re-bank it by hand -- so each
        # merge to main moved it under every other PR in flight, and they all conflicted.
        # Banking it here instead takes it out of the PR diff entirely for the common
        # (lowering) case. Safe in the only direction that matters: langmode_audit.py
        # --check fails on a RISE only, so main carrying a stale-high baseline between a
        # merge and this refresh is permissive, never falsely red. A PR that legitimately
        # RAISES a count still banks it itself -- this step runs post-merge and so cannot
        # be used to launder a rise past the gate.
        run: python tools/langmode_audit.py --json langmode-baseline.json

      - name: Refresh README progress bar
        run: python tools/progress.py --write-readme --from-db _chaos_data/chaos-db.json
      - name: Regenerate treemap (README SVG + Pages HTML)
        run: python tools/treemap.py --from-db _chaos_data/chaos-db.json --out docs/index.html --svg docs/progress-treemap.svg
      - name: Commit progress refresh if changed
        # README bar + treemap + contributions in ONE commit, to keep the #github channel
        # from filling with a separate refresh commit per generated file.
        # safe from retrigger loops: no workflow watches README.md, docs/**, or contributions.json
        # on push, and langmode-baseline.json is watched only by langmode-ratchet.yml, which is
        # pull_request-only. config/** is the one watched path here, which is what [skip ci] covers.
        run: |
          if git diff --quiet -- README.md docs/index.html docs/progress-treemap.svg contributions.json config/match_provenance.jsonl config/match_attempts.jsonl nearmiss/db.jsonl langmode-baseline.json; then
            echo "progress unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add README.md docs/index.html docs/progress-treemap.svg contributions.json config/match_provenance.jsonl config/match_attempts.jsonl nearmiss/db.jsonl langmode-baseline.json
          # [skip ci] is load-bearing since the push moved to a deploy key. A GITHUB_TOKEN
          # push never triggers workflows, so this commit used to be inert; a deploy-key
          # push is an ordinary push and does trigger them. Without the marker this commit
          # would retrigger this job (it touches config/) and newly fire report.yml.
          git commit -m "Refresh progress (README, treemap, contributions, provenance, langmode) [skip ci]"
          # The rebase is not enough on its own: main can move again between it and the push.
          # A rejected push here leaves contributions.json unmoved, and per the coin ledger's
          # contract - it pays the DELTA between that file and what it last paid - a match whose
          # refresh never lands never earns its author anything. Retry the pair; if another
          # refresh has already landed these same files it read a newer main than this run did,
          # so stand down instead of fighting it or going red.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            if ! git diff --quiet "$base" FETCH_HEAD -- README.md docs/index.html docs/progress-treemap.svg contributions.json config/match_provenance.jsonl config/match_attempts.jsonl nearmiss/db.jsonl langmode-baseline.json; then
              echo "another refresh already landed these files - standing down"; exit 0
            fi
            echo "main moved under the refresh push - retrying (attempt $attempt)"
            sleep 5
          done
          echo "main kept moving - could not land the progress refresh"; exit 1
