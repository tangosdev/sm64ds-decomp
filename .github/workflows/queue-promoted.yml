# Does the TU promotion queue still know which classes are already promoted?
#
# notes/data/tu-promotion-queue.tsv is GENERATED by tools/queue_audit.py, and it is what
# fleet dispatch screens TU candidates from. A row reading `already_promoted = no` for a
# class that is in fact promoted does not produce a wrong answer -- it produces a WHOLE
# AGENT sent to redo landed work. That happened on 2026-09-18: daObjTh_Fall_Block_c had
# been promoted four days earlier, the queue still said `no`, and the agent dispatched
# against it found the TU already on main -- manifest `status: promoted`, one `complete`
# span in delinks.txt, all four symbols already re-keyed in converted-baseline.json. It
# produced no commit because there was nothing to do. daTrsTrap_c, promoted the same day,
# was the next candidate on the same screen.
#
# NOTHING WAS WATCHING, AND THE FILE SAID SOMETHING WAS. Its header advertised
# `--check in CI`; `grep -rn queue_audit .github/` returned nothing. The stale rows
# survived a same-day regeneration (#2745) for exactly that reason. A reader who checked
# the header concluded the column was guarded, which is worse than an artifact that
# admits it is unguarded.
#
# THIS GATE CHECKS ONE COLUMN, AND SAYS SO IN ITS OWN OUTPUT. The full `--check` cannot
# run here at any price: `compiler-only` needs build/rtti.json and every measured column
# needs build/tu_map.json, and both are derived from extracted/arm9_dec.bin and
# extracted/overlays/*.bin -- the cartridge dump, which is not in the repository and is
# not redownloadable. So shard_count, total_lines, unmatched, no-legacy-source,
# not-in-delinks and compiler-only are NOT checked by this workflow and a green run here
# is not evidence about any of them. `already_promoted` is the one column derived purely
# from git-tracked files: tools/queue_audit.py reads it from config/tu_manifest.d/**,
# nothing else. It is also the only column that can waste an agent.
#
# WHOLE-TREE, no `paths:` filter, and the reason is the failure itself. The change that
# breaks this correspondence is a PROMOTION, and a promotion writes
# config/tu_manifest.d/<ov>/<Class>.json, src/, delinks.txt and converted-baseline.json
# -- it does not open notes/data/tu-promotion-queue.tsv at all. A filter listing that TSV
# would let through precisely the change that invalidates it, which is the only failure
# this gate exists to catch. Measured: #2760 promoted daObjWlPolelift_c and touched no
# queue row, so this gate went red on that merge, correctly.
#
# AN EMPTY CHECK IS NOT A PASS. A manifest directory that resolves to no entries, a queue
# that resolves to no rows, and a queue where no row makes a promotion claim all exit 2
# rather than printing a reassuring `checked 0` and exiting 0.
#
# ADVISORY ON PURPOSE. `PR validation` is this repo's only required check. Red here means
# "regenerate the queue", not "this PR is wrong" -- a promotion PR is doing the right
# thing and simply has not re-derived the artifact yet. Making it required would block
# correct work on a generated file, which is how a gate gets switched off.
#
# Costs nothing: stdlib Python over git-tracked text, no compiler, no ROM, well under a
# second across 228 rows and 181 manifest entries.
name: queue promoted column

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Its own concurrency group. Sharing one is what made the range gates cancel each other's
# runs in #2042.
concurrency:
  group: queue-promoted-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  promoted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No history needed: the check reads the working tree, config/ and notes/.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: already_promoted agrees with config/tu_manifest.d
        # The tool prints the row count, the manifest-entry count and an explicit line
        # naming the columns it does NOT check. A pass that does not say what it
        # inspected cannot be told apart from one that stopped seeing its inputs.
        run: python tools/queue_audit.py --check-promoted

      # unittest, not pytest: pytest is not installed on this runner, and the point of
      # this step is that the gate's FAILURE branches still work, so it must not be the
      # step that needs a dependency. `if: always()` so a red gate above still reports
      # whether the gate itself is sound -- those are different questions. Twelve tests,
      # and eight of them assert a non-zero exit: both directions of disagreement, the
      # multi-class `A+B` row, and all four ways an empty input must refuse rather than
      # pass. Kept here rather than in tool-tests.yml, matching tubuild-conflicts.yml.
      - name: The gate's own tests
        if: always()
        run: python -m unittest tools.test_queue_audit
