name: Data tracking

# Data byte verification already has two ratchets: source_coverage.py protects
# source-built bytes and validate_merge.py protects emitted romData symbols.
# This job is the missing credit/progress ratchet: an address that becomes a
# complete delinks claim needs a row in data-authors.json. The inventory is
# scanned from committed configuration and source, so this needs no ROM or compiler.
on:
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "data-authors.json"
      - "tools/data_tiers.py"
      - "tools/data_inventory.py"
      - "tools/data_evidence.py"
      - "tools/test_data_tiers.py"
      - "README.md"
      - "notes/data-tracking.md"
      - "MERGE.md"
      - ".github/workflows/data-tracking.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "data-authors.json"
      - "tools/data_tiers.py"
      - "tools/data_inventory.py"
      - "tools/data_evidence.py"
      - "tools/test_data_tiers.py"
      - "README.md"
      - "notes/data-tracking.md"
      - "MERGE.md"
      - ".github/workflows/data-tracking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tracker unit tests
        run: python -m unittest -v tools.test_data_tiers

      - name: Credit and claim ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/data_tiers.py --check --base "origin/${{ github.base_ref }}"
          else
            python tools/data_tiers.py --check
          fi
