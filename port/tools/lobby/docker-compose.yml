# sm64ds-lobby. Room state and chat for the port's Multiplayer button.
#
# NOT APPLIED BY THIS LANE. This file and the Caddy block in README.md are
# written as deploy artifacts; the deploy itself is the coordinator's step,
# after review.
#
# House convention, from port-ingest/docker-compose.yml: ONLY CADDY PUBLISHES
# HOST PORTS. This joins the existing external `web` network and is reached at
# sm64ds_lobby:8091 from inside it.
#
# There is no env_file, no .env and NO SECRET OF ANY KIND, because this service
# has no credential to hold. There is no `volumes:` either: nothing is
# persisted, the container is read_only, and every room lives in memory and
# dies with the process. That is the whole recovery story.
services:
  sm64ds-lobby:
    build: .
    image: sm64ds-lobby:local
    container_name: sm64ds_lobby
    restart: unless-stopped
    user: "1002:1002"
    environment:
      LISTEN_PORT: "8091"
      MAX_ROOMS: "64"
      # THESE TWO NUMBERS ARE THE PLAYER-COUNT DIAL'S CEILING.
      #
      # The host picks how many of a room's seats play (`match_players`, the
      # dial). The server refuses anything above min(16, MAX_SEATS,
      # GAME_MAX_PLAYERS) and advertises that bound to every launcher as
      # `dial_max`, so the launcher greys out the rest of the control instead
      # of letting a host be refused.
      #
      # MAX_SEATS is how many people a room HOLDS. GAME_MAX_PLAYERS is how many
      # of them THE GAME BUILD THIS DEPLOYMENT LAUNCHES can actually play.
      #
      # BOTH ARE 16 AS OF 0.3.2, AND 16 IS WHAT THE GAME DOES. Sixteen real
      # windows on one arena in lockstep, a full match to MATCH OVER with
      # sixteen scores (status/VS16.md, status/VS16HOST.md). The relay's seat
      # knob (SM64DS_RELAY_MAX_CHILDREN=15 on the deployed unit) moved with
      # these; a deployment that has not raised the relay must not raise these,
      # or the sixteenth seat pairs in the lobby and is refused on the wire.
      MAX_SEATS: "16"
      GAME_MAX_PLAYERS: "16"
      MAX_WAITERS: "96"
      # The largest "first to N stars" the host may pick. Five because an
      # arena holds five stars; past that the game would have to respawn them.
      STAR_TARGET_MAX: "5"
      # How long a kicked address is refused by the room that kicked it. It is
      # a cooldown rather than a ban because the address is the only handle an
      # accountless lobby has, and a whole house shares one. See the note on
      # KICK_COOLDOWN_S in app/server.py.
      KICK_COOLDOWN_S: "120"
      ARM_DEADLINE_S: "20"
      GO_GRACE_S: "5"
      MEMBER_TIMEOUT_S: "45"
      ROOM_IDLE_S: "1800"
      MATCH_TIMEOUT_S: "1200"
      RELAY_ADDR: "135.148.26.201:41234"
      RATE_REQ_PER_S: "20"
      RATE_BURST: "40"
      RATE_CREATE_PER_HOUR: "30"
      RATE_JOIN_PER_MIN: "60"
      # A sender refused this many times inside this many seconds is refused
      # outright for this many more. Same shape relay.py uses.
      BAD_LIMIT: "10"
      BAD_WINDOW_S: "10"
      BAD_IGNORE_S: "10"
      # The deadline on every blocking socket read. A client that announces a
      # body and never sends it would otherwise hold a worker thread forever,
      # and a thread is a pid against pids_limit below. A long poll does not
      # ride this -- it waits on a condition, not on a read.
      HANDLER_TIMEOUT_S: "20"
      # Behind Caddy the socket peer is always Caddy, so without this every
      # per-IP limit would be a per-SERVER limit and two launchers on one desk
      # would share one budget with the whole internet. The service reads the
      # LAST X-Forwarded-For entry, which Caddy controls, not the first, which
      # the client controls. Set this to "0" for any deployment where clients
      # can reach the container directly -- with no proxy in front there is no
      # trustworthy entry and the header becomes a limiter bypass.
      TRUST_XFF: "1"
      # Lobby 1.0 (contract v5). RELAY_V is the relay protocol the plans name:
      # 2 once relay v2 is deployed; 1 turns the world pool off.
      RELAY_V: "2"
      # THE GAME BUILDS THIS SERVER SERVES, comma-separated launcher `game`
      # ids (version.json: "<game version>-<first 8 hex of the git tip>",
      # e.g. "1.0.0-0123abcd"). THE RELEASE STEP WRITES THIS LINE: every
      # create/join/world naming another build is refused "unknown_game"
      # (the launcher says check for an update). Left EMPTY, code rooms take
      # any build and the world pool stays OFF, so a deploy that forgot this
      # line cannot reopen the world-pool flood (review REVLOBBY5, S2).
      GAME_IDS: ""
      # The world pool: worlds in the pool (every build together), members a
      # world, a member unheard this long is not counted (the launcher pings
      # every 10 s), a world with no live member is dropped after this, and
      # live members one client address may hold (a household behind one
      # connection; a fifth ask retires that address's oldest).
      MAX_WORLDS: "64"
      WORLD_SEATS: "32"
      WORLD_MEMBER_S: "30"
      WORLD_EMPTY_S: "30"
      WORLD_ADDR_TOKENS: "4"
      # An adventure code room closes after this long with nobody in it.
      ADV_EMPTY_S: "600"
      # ARENA MODE (run mp1 A4): the builds that play VS in arena mode (own
      # Yoshi with no input delay, a referee on the relay), comma-separated
      # like GAME_IDS. EMPTY = arena off: every VS match plays lockstep, as
      # before. Written at the relay redeploy that brings the referee;
      # emptying it again is the rollback. Never "*" here (dev boxes only).
      ARENA_GAME_IDS: ""
      # The builds whose Luigi Infection matches play arena (the referee's
      # Luigi rules; a build must be on ARENA_GAME_IDS too). EMPTY = every
      # Luigi match plays lockstep, as before. EXACT build ids only, never
      # "*" here: "*" would put every older listed build's Luigi rooms on
      # arena, and a build without the referee's Luigi rules freezes on the
      # countdown. Each release adds its own id in the same restart that adds
      # it to GAME_IDS / ARENA_GAME_IDS; the restart drops open rooms, so do
      # it when none are open.
      # ARENA_LUIGI_GAME_IDS: ""
      # The largest arena match (phase A: 4); bigger matches play lockstep.
      ARENA_MAX_PLAYERS: "4"
      # A new room's netmode pick; the host can switch it to lockstep.
      NETMODE_DEFAULT: "arena"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    networks: [web]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 256
networks:
  web:
    external: true
